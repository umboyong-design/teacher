<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공통수학2 맞춤 학습지 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9f1;--panel:#fff;--ink:#1c2442;--mute:#5d6685;--line:#cdd3e3;--acc:#243b8f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111528;--panel:#1b2140;--ink:#e6e9f7;--mute:#9aa3c7;--line:#2e3760;--acc:#9bb0ff;--on:#10163a}}
:root[data-theme="dark"]{--bg:#111528;--panel:#1b2140;--ink:#e6e9f7;--mute:#9aa3c7;--line:#2e3760;--acc:#9bb0ff;--on:#10163a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans KR',system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;position:sticky;top:12px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
h2{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}
.chip input:checked+span{background:var(--acc);color:var(--on);border-color:var(--acc)}
.chip input:focus-visible+span,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input[type=number],select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=number]{width:70px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px}
button.main{background:var(--acc);color:var(--on);border-color:var(--acc);width:100%;margin-top:14px;padding:9px}
button.on{background:var(--acc);color:var(--on)}
.stack{display:grid;gap:8px;margin-top:8px}
.paper{background:#fff;color:#111;font-family:'Noto Serif KR',serif;max-width:210mm;min-height:297mm;margin:0 auto;padding:16mm;box-shadow:0 2px 14px rgba(0,0,0,.18);line-height:1.7}
.hd{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid #1c2442;padding-bottom:8px;margin-bottom:6px;gap:12px}
.hd h3{margin:0;font-size:22px}
.meta{font-size:13px;color:#444;white-space:nowrap}
.units{font-size:12px;color:#555;margin-bottom:14px}
.p{display:grid;grid-template-columns:2.4em 1fr auto;gap:2px 6px;padding:10px 0;border-bottom:1px dotted #bbb;break-inside:avoid}
.n{font-weight:600;text-align:right}
.q{white-space:pre-wrap;font-size:16px}
.lv{font-size:10px;letter-spacing:1px;color:#243b8f;border:0;background:none;padding:0;cursor:default}
.tl{grid-column:2/4;display:flex;gap:4px;flex-wrap:wrap}
.tl button{font-size:12px;padding:2px 8px}
.sp{grid-column:2/4}
.ans{margin-top:30px;border-top:2px solid #1c2442;padding-top:10px}
.ans h3{margin:0 0 8px}
.al{display:grid;grid-template-columns:2.4em 1fr;gap:0 6px;font-size:15px}
.u{font-size:11px;color:#666}
[contenteditable=true]{outline:1.5px dashed #243b8f;outline-offset:2px;background:#f4f6ff;border-radius:3px}
.empty{padding:40px 0;text-align:center;color:#666}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:10px}.panel{position:static}.paper{padding:6mm;min-height:0}.hd{flex-direction:column;align-items:start}}
@media print{@page{size:A4;margin:14mm}body{background:#fff}.panel,.tl{display:none!important}.wrap{display:block;padding:0}.paper{box-shadow:none;padding:0;min-height:0;max-width:none}.ans{break-before:page;border-top:0;margin-top:0}[contenteditable]{outline:0!important;background:none!important}}
</style></head><body>
<div class="wrap">
<aside class="panel">
<h1>공통수학2 학습지 만들기</h1>
<p class="sub">단원과 난이도를 고르면 쉬운 문제부터 차례로 배치돼요.</p>
<h2>단원</h2><div class="chips" id="units"></div>
<h2>난이도</h2><div class="chips" id="lvs"></div>
<h2>문항 수와 풀이 공간</h2>
<div class="row"><input type="number" id="cnt" value="9" min="1" max="40" aria-label="문항 수"><span>문항</span>
<select id="sp" aria-label="풀이 공간"><option value="0">풀이 공간 없음</option><option value="50" selected>보통</option><option value="110">넓게</option></select></div>
<div class="row"><label><input type="checkbox" id="ansOn" checked> 정답지를 마지막 장에 넣기</label></div>
<button class="main" id="gen">학습지 만들기</button>
<div class="stack">
<button id="edit">문제 수정 모드 켜기</button>
<button id="add">문제 직접 추가</button>
<button id="pdf">PDF로 저장</button>
</div>
<p class="hint">수정 모드에서는 제목, 문제, 정답을 직접 고칠 수 있고 ●를 눌러 난이도를 바꿀 수 있어요. PDF로 저장을 누르면 인쇄 창이 열려요. 대상 프린터를 “PDF로 저장”으로 고르세요.</p>
</aside>
<main><div class="paper" id="paper"></div></main>
</div>
<script>
const U={
"평면좌표와 직선":[
[["두 점 A(1, 2), B(4, 6) 사이의 거리를 구하시오.","5"],["두 점 A(2, 3), B(8, 9)를 이은 선분 AB의 중점의 좌표를 구하시오.","(5, 6)"],["점 (1, 2)를 지나고 기울기가 3인 직선의 방정식을 구하시오.","y = 3x − 1"]],
[["두 점 A(1, 2), B(7, 8)을 이은 선분 AB를 2 : 1로 내분하는 점의 좌표를 구하시오.","(5, 6)"],["점 (2, 1)을 지나고 직선 2x − y + 3 = 0에 평행한 직선의 방정식을 구하시오.","y = 2x − 3"],["점 (3, −1)을 지나고 직선 x + 2y − 4 = 0에 수직인 직선의 방정식을 구하시오.","y = 2x − 7"]],
[["점 (1, 2)와 직선 3x + 4y − 5 = 0 사이의 거리를 구하시오.","6/5"],["평행한 두 직선 3x + 4y + 1 = 0, 3x + 4y − 9 = 0 사이의 거리를 구하시오.","2"],["두 직선 x + 2y − 3 = 0, 2x − y + 4 = 0의 교점과 원점을 지나는 직선의 방정식을 구하시오.","2x + y = 0"]]],
"원의 방정식":[
[["중심이 (1, −2)이고 반지름의 길이가 3인 원의 방정식을 구하시오.","(x − 1)² + (y + 2)² = 9"],["원 (x − 2)² + (y + 3)² = 16의 중심의 좌표와 반지름의 길이를 구하시오.","중심 (2, −3), 반지름 4"],["원점이 중심이고 점 (3, −4)를 지나는 원의 방정식을 구하시오.","x² + y² = 25"]],
[["원 x² + y² − 4x + 6y − 12 = 0의 중심의 좌표와 반지름의 길이를 구하시오.","중심 (2, −3), 반지름 5"],["두 점 A(1, 2), B(5, 2)를 지름의 양 끝점으로 하는 원의 방정식을 구하시오.","(x − 3)² + (y − 2)² = 4"],["원 x² + y² = 25 위의 점 (3, 4)에서의 접선의 방정식을 구하시오.","3x + 4y = 25"]],
[["원 x² + y² = 4와 직선 y = x + k가 서로 다른 두 점에서 만나도록 하는 실수 k의 값의 범위를 구하시오.","−2√2 < k < 2√2"],["원 x² + y² = 10에 접하고 기울기가 3인 직선의 방정식을 구하시오.","y = 3x + 10 또는 y = 3x − 10"],["두 원 x² + y² = 4, (x − 3)² + y² = 1의 위치 관계를 말하시오.","외접한다 (중심 사이의 거리 3 = 2 + 1)"]]],
"도형의 이동":[
[["점 (2, 3)을 x축의 방향으로 3, y축의 방향으로 −1만큼 평행이동한 점의 좌표를 구하시오.","(5, 2)"],["점 (3, −2)를 x축에 대하여 대칭이동한 점의 좌표를 구하시오.","(3, 2)"],["점 (3, −2)를 원점에 대하여 대칭이동한 점의 좌표를 구하시오.","(−3, 2)"]],
[["직선 y = 2x + 1을 x축의 방향으로 1, y축의 방향으로 −3만큼 평행이동한 직선의 방정식을 구하시오.","y = 2x − 4"],["원 x² + y² = 4를 x축의 방향으로 2, y축의 방향으로 −1만큼 평행이동한 원의 방정식을 구하시오.","(x − 2)² + (y + 1)² = 4"],["점 (1, 4)를 직선 y = x에 대하여 대칭이동한 점의 좌표를 구하시오.","(4, 1)"]],
[["포물선 y = x² − 2x + 3을 y축에 대하여 대칭이동한 포물선의 방정식을 구하시오.","y = x² + 2x + 3"],["직선 2x − y + 3 = 0을 직선 y = x에 대하여 대칭이동한 직선의 방정식을 구하시오.","x − 2y − 3 = 0"],["두 점 A(1, 2), B(4, 1)과 x축 위의 점 P에 대하여 AP + BP의 최솟값을 구하시오.","3√2"]]],
"집합":[

[["A = {1, 3, 5, 7, 9}, B = {2, 3, 5, 7}일 때, A − B를 구하시오.","{1, 9}"],["집합 A = {a, b, c, d}의 부분집합 중 a를 반드시 원소로 갖는 것의 개수를 구하시오.","8"],["n(A) = 10, n(B) = 8, n(A ∩ B) = 3일 때, n(A ∪ B)를 구하시오.","15"]],
[["집합 {1, 2, 3, 4, 5}의 부분집합 중 1, 2는 포함하고 5는 포함하지 않는 것의 개수를 구하시오.","4"],["전체집합 U에서 n(U) = 30, n(A) = 18, n(B) = 15, n(Aᶜ ∩ Bᶜ) = 4일 때, n(A ∩ B)를 구하시오.","7"],["A = {x | x² − 5x + 6 = 0}, B = {x | x² − x − 2 = 0}일 때, A ∩ B와 A ∪ B를 구하시오.","A ∩ B = {2}, A ∪ B = {−1, 2, 3}"]]],
"명제":[
[["명제 “2는 소수이다.”의 참, 거짓을 판별하시오.","참"],["조건 p: x > 3의 부정 ∼p를 말하시오.","x ≤ 3"],["명제 “x = 1이면 x² = 1이다.”의 역을 쓰고 참, 거짓을 판별하시오.","x² = 1이면 x = 1이다. (거짓)"]],
[["명제 “x² = 4이면 x = 2이다.”가 거짓임을 보이는 반례를 구하시오.","x = −2"],["두 조건 p: x > 2, q: x > 0에 대하여 p는 q이기 위한 어떤 조건인지 말하시오.","충분조건"],["명제 “모든 실수 x에 대하여 x² ≥ 0이다.”의 부정을 쓰시오.","어떤 실수 x에 대하여 x² < 0이다."]],
[["두 조건 p: x² − 3x + 2 = 0, q: x = 1에 대하여 p는 q이기 위한 어떤 조건인지 말하시오.","필요조건 (필요충분조건은 아님)"],["명제 “a > 0이고 b > 0이면 ab > 0이다.”의 대우를 쓰시오.","ab ≤ 0이면 a ≤ 0 또는 b ≤ 0이다."],["a > 0, b > 0일 때, (a + b)(1/a + 1/b)의 최솟값을 구하시오.","4"]]],
"함수":[
[["f(x) = 2x + 1일 때, f(3)의 값을 구하시오.","7"],["f(x) = x² − x일 때, f(−2)의 값을 구하시오.","6"],["함수 y = x + 2의 정의역이 {1, 2, 3}일 때, 치역을 구하시오.","{3, 4, 5}"]],
[["f(x) = 2x + 1, g(x) = x²일 때, (g ∘ f)(1)의 값을 구하시오.","9"],["함수 f(x) = 2x − 3의 역함수를 구하시오.","y = (x + 3)/2"],["함수 f(x) = 3x + a에 대하여 f⁻¹(5) = 1일 때, 상수 a의 값을 구하시오.","2"]],
[["f(x) = x + 1, g(x) = 2x − 3일 때, (g ∘ f)(x) = 5를 만족시키는 x의 값을 구하시오.","3"],["정의역이 {x | 1 ≤ x ≤ 3}, 공역이 {y | 3 ≤ y ≤ 7}인 함수 f(x) = ax + b가 일대일대응일 때 (a > 0), 상수 a, b의 값을 구하시오.","a = 2, b = 1"],["f(x) = 2x − 1일 때, (f ∘ f)(a) = 9를 만족시키는 a의 값을 구하시오.","3"]]],
"유리함수":[
[["함수 y = 1/x의 그래프의 점근선의 방정식을 구하시오.","x = 0, y = 0"],["함수 y = 2/x의 그래프를 x축의 방향으로 1만큼 평행이동한 그래프의 식을 구하시오.","y = 2/(x − 1)"],["함수 y = 1/(x − 2) + 3의 그래프의 점근선의 방정식을 구하시오.","x = 2, y = 3"]],
[["함수 y = (2x + 1)/(x − 1)을 y = k/(x − p) + q 꼴로 나타내시오.","y = 3/(x − 1) + 2"],["함수 y = (x + 3)/(x + 1)의 그래프의 점근선의 방정식을 구하시오.","x = −1, y = 1"],["함수 y = 3/(x − 1) − 2의 정의역과 치역을 구하시오.","정의역 {x | x ≠ 1}, 치역 {y | y ≠ −2}"]],
[["함수 y = (ax + b)/(x + c)의 점근선이 x = 2, y = 3이고 그래프가 점 (0, 1)을 지날 때, a + b + c의 값을 구하시오.","−1"],["정의역이 {x | 2 ≤ x ≤ 3}일 때, 함수 y = 2/(x − 1) + 1의 최댓값과 최솟값을 구하시오.","최댓값 3, 최솟값 2"],["직선 y = −x + k와 곡선 y = 1/x가 한 점에서 만나도록 하는 k의 값을 모두 구하시오.","k = 2 또는 k = −2"]]],
"무리함수":[
[["함수 y = √x의 정의역을 구하시오.","{x | x ≥ 0}"],["함수 y = √(x + 2)의 정의역을 구하시오.","{x | x ≥ −2}"],["함수 y = √x + 1의 치역을 구하시오.","{y | y ≥ 1}"]],
[["함수 y = √(x − 2) + 1의 그래프는 y = √x의 그래프를 어떻게 평행이동한 것인지 말하시오.","x축의 방향으로 2, y축의 방향으로 1만큼"],["함수 y = √(2x − 4)의 정의역과 치역을 구하시오.","정의역 {x | x ≥ 2}, 치역 {y | y ≥ 0}"],["방정식 √(x + 2) = x의 해를 구하시오.","x = 2"]],
[["방정식 √(2x + 3) = x의 해를 구하시오.","x = 3"],["함수 y = √(ax + b)의 그래프가 두 점 (1, 2), (3, 4)를 지날 때, 상수 a, b의 값을 구하시오.","a = 6, b = −2"],["함수 y = √(x + 1)의 역함수를 구하고 그 정의역을 쓰시오.","y = x² − 1 (x ≥ 0)"]]]
};
const $=s=>document.querySelector(s),names=Object.keys(U),DOT=['','●○○','●●○','●●●'],LN=['','하','중','상'];
let items=[],edit=false,title='공통수학2 연습 문제',uid=0;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#units').innerHTML=names.map((u,i)=>`<label class="chip"><input type="checkbox" value="${u}" ${i<3?'checked':''}><span>${u}</span></label>`).join('');
$('#lvs').innerHTML=[1,2,3].map(l=>`<label class="chip"><input type="checkbox" value="${l}" checked><span>${LN[l]}</span></label>`).join('');
const sel=(id)=>[...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pool=(l,us)=>us.flatMap(u=>U[u][l-1].map(([q,a])=>({unit:u,lv:l,q,a})));
function gen(){
 const us=sel('units'),ls=sel('lvs').map(Number);
 if(!us.length||!ls.length){items=[];render();return}
 const n=Math.max(1,Math.min(40,+$('#cnt').value||9));let out=[];
 ls.forEach((l,i)=>{const k=Math.floor(n/ls.length)+(i<n%ls.length?1:0);out.push(...shuf(pool(l,us)).slice(0,k))});
 items=out.sort((a,b)=>a.lv-b.lv||names.indexOf(a.unit)-names.indexOf(b.unit)).map(o=>({...o,id:++uid}));
 render();
}
function render(){
 const us=sel('units'),sp=+$('#sp').value;
 const body=items.length?items.map((it,i)=>`<div class="p" data-i="${i}"><div class="n">${i+1}.</div><div class="q ed" data-f="q">${esc(it.q)}</div><button class="lv" data-act="lv" title="난이도 ${LN[it.lv]}">${DOT[it.lv]}</button><div class="tl"><span class="u">${esc(it.unit)} · ${LN[it.lv]}</span><button data-act="re">다시 뽑기</button><button data-act="up">위로</button><button data-act="dn">아래로</button><button data-act="del">삭제</button></div><div class="sp" style="height:${sp}px"></div></div>`).join('')
 :'<div class="empty">단원과 난이도를 하나 이상 고른 뒤 “학습지 만들기”를 눌러 주세요.</div>';
 const ans=$('#ansOn').checked&&items.length?`<div class="ans"><h3>정답</h3><div class="al">${items.map((it,i)=>`<div class="n">${i+1}.</div><div class="ed" data-i="${i}" data-f="a">${esc(it.a)}</div>`).join('')}</div></div>`:'';
 $('#paper').innerHTML=`<div class="hd"><h3 class="ed" id="ttl">${esc(title)}</h3><div class="meta">이름 ________ 　날짜 ________ 　점수 ____ / ${items.length}</div></div><div class="units">${us.length?esc(us.join(', ')):'단원 미선택'} · 난이도 ${sel('lvs').map(l=>LN[l]).join('·')}</div>${body}${ans}`;
 setEdit();
}
function setEdit(){document.querySelectorAll('.ed').forEach(e=>e.setAttribute('contenteditable',edit?'true':'false'));$('#edit').textContent=edit?'수정 모드 끄기':'문제 수정 모드 켜기';$('#edit').classList.toggle('on',edit)}
$('#paper').addEventListener('input',e=>{
 const el=e.target.closest('.ed');if(!el)return;
 if(el.id==='ttl'){title=el.innerText;return}
 const p=el.closest('.p'),i=el.dataset.i??p?.dataset.i;if(i!=null)items[i][el.dataset.f]=el.innerText;
});
$('#paper').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const i=+b.closest('.p').dataset.i,it=items[i],a=b.dataset.act;
 if(a==='del')items.splice(i,1);
 else if(a==='up'&&i>0)[items[i-1],items[i]]=[items[i],items[i-1]];
 else if(a==='dn'&&i<items.length-1)[items[i+1],items[i]]=[items[i],items[i+1]];
 else if(a==='lv'){if(!edit)return;it.lv=it.lv%3+1}
 else if(a==='re'){
  const used=new Set(items.map(x=>x.q)),us=sel('units');
  let c=pool(it.lv,U[it.unit]?[it.unit]:us).filter(x=>!used.has(x.q));
  if(!c.length)c=pool(it.lv,us.length?us:names).filter(x=>!used.has(x.q));
  if(!c.length){alert('같은 난이도에서 바꿀 수 있는 다른 문제가 없어요.');return}
  items[i]={...shuf(c)[0],id:++uid};
 }
 render();
});
$('#gen').onclick=gen;
$('#sp').onchange=$('#ansOn').onchange=render;
$('#edit').onclick=()=>{edit=!edit;setEdit()};
$('#add').onclick=()=>{items.push({id:++uid,unit:'직접 입력',lv:2,q:'문제를 입력하세요.',a:'정답을 입력하세요.'});edit=true;render();document.querySelector('.p:last-of-type .q')?.focus()};
$('#pdf').onclick=()=>{try{window.print()}catch(e){alert('브라우저 메뉴의 인쇄(Ctrl/⌘ + P)에서 “PDF로 저장”을 선택해 주세요.')}};
gen();
</script></body></html>
